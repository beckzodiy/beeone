name = "mommy-knows-shop"
main = "src/index.js"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"] # needed for @ton/core (uses Buffer) to build the on-chain payment comment

# Mini app HTML is inlined into the Worker (see src/index.js); /api/* and /webhook go to the Worker too.

# Polls TON for incoming GRAM payments once a minute; see scheduled() in src/index.js.
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "mommy-knows-db"
database_id = "48f61c19-7df4-4dc9-91cf-992c10c9de5d"

[vars]
ADMIN_ID = "5092483247"
BOT_USERNAME = "beeone_orderbot"
PUBLIC_URL = "https://mommy-knows-shop.beckzodiy.workers.dev"
COMMISSION_PERCENT = "10"

# GRAM (TON) payments — start on testnet, see README for how to switch to mainnet.
GRAM_MERCHANT_ADDRESS = "UQA8dXWKPfL2xemPiNEvpsDx5P_XZ0iuZSDwJJ7Ww2MDL3dH"
TONCENTER_BASE_URL = "https://testnet.toncenter.com/api/v3"
GRAM_QUOTE_MINUTES = "10"

# Secrets (set with `npx wrangler secret put NAME`):
#   BOT_TOKEN           - from @BotFather
#   WEBHOOK_SECRET      - any random string (A-Z a-z 0-9 _ -), protects /webhook and /setup
#   TONCENTER_API_KEY   - optional, free via https://t.me/toncenter ("Manage API Keys"); raises the 10 req/sec default limit
